name: Cloudflare redirect sync

on:
  push:
    branches: [main]
    paths:
      - "src/data/redirects.js"
      - "scripts/cf-migrate-redirects.mjs"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Sync redirects to Cloudflare Bulk Redirect List
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:migrate-redirects
